<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiarash Farahmandrad — multi-disciplinary designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=Azeret+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#070708;
    --deep:#101113;
    --ice:#f3f3f3;
    --mute:#b7babc;
    --dim:#83878a;
    --key:#ffffff;
    --line:rgba(255,255,255,.26);
    --hair:rgba(255,255,255,.12);
    --plate:rgba(8,9,10,.62);
    --sheet:rgba(9,10,11,.86);
    --tsh:0 1px 10px rgba(0,0,0,.95);
    --scan:rgba(255,255,255,.045);
    --scan-op:.4;
    --sweep:rgba(255,255,255,.05);
    --scrim-a:rgba(0,0,0,.55);
    --scrim-b:rgba(0,0,0,.70);
    --vig:rgba(0,0,0,.82);
    --grain-op:.11;
    --glow:rgba(255,255,255,.6);
    /* placeholder artwork palette */
    --ph0:#0c0d0f; --ph1:#191b1e; --ph2:#2e3338; --ph3:#e9eaec;
  }
  body.light{
    --void:#edebe6;
    --deep:#dedbd4;
    --ice:#16171a;
    --mute:#4c5052;
    --dim:#7d8184;
    --key:#0b0b0c;
    --line:rgba(12,12,14,.32);
    --hair:rgba(12,12,14,.16);
    --plate:rgba(255,255,255,.55);
    --sheet:rgba(245,243,239,.9);
    --tsh:0 1px 10px rgba(255,255,255,.85);
    --scan:rgba(0,0,0,.03);
    --scan-op:.35;
    --sweep:rgba(255,255,255,.55);
    --scrim-a:rgba(150,146,138,.16);
    --scrim-b:rgba(150,146,138,.22);
    --vig:rgba(122,118,110,.30);
    --grain-op:.07;
    --glow:rgba(0,0,0,.35);
    --ph0:#e3e0d9; --ph1:#d4d0c7; --ph2:#b6b1a6; --ph3:#17181a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--void);color:var(--ice);
    font-family:'Archivo',system-ui,sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased;
    transition:background .7s ease,color .7s ease;
  }
  @media (pointer:fine){
    html,body,#gl,.hud,.hud a,.fx,.chip,.panel,.panel *,button{cursor:none}
  }
  #gl{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;
    display:block;z-index:0}

  /* ── screen treatment ─────────────────────────────── */
  .fx{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;
    z-index:2;pointer-events:none;overflow:hidden}
  .scan{position:absolute;inset:0;opacity:var(--scan-op);mix-blend-mode:screen;
    background:repeating-linear-gradient(to bottom,var(--scan) 0 1px,transparent 1px 3px)}
  body.light .scan{mix-blend-mode:multiply}
  .scrim{position:absolute;inset:0;background:linear-gradient(to bottom,
    var(--scrim-a) 0,rgba(0,0,0,0) 24%,rgba(0,0,0,0) 58%,var(--scrim-b) 100%)}
  .sweep{position:absolute;left:0;right:0;height:140px;top:-140px;
    background:linear-gradient(to bottom,transparent,var(--sweep),transparent);
    animation:sweep 11s linear infinite}
  @keyframes sweep{0%{transform:translateY(0)}100%{transform:translateY(calc(100vh + 280px))}}
  .vig{position:absolute;inset:0;background:radial-gradient(115% 85% at 50% 46%,transparent 38%,var(--vig) 100%)}
  .grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:var(--grain-op);mix-blend-mode:overlay;
    background-repeat:repeat;background-size:180px 180px}

  /* ── reticle ──────────────────────────────────────── */
  .ret{position:fixed;left:0;top:0;z-index:9;pointer-events:none;opacity:0;
    transform:translate(-50%,-50%);transition:opacity .25s}
  .ret.on{opacity:1}
  .ret svg{display:block;overflow:visible;transform:scale(.62) rotate(0deg);
    transition:transform .28s cubic-bezier(.2,.8,.3,1)}
  .ret path{fill:none;stroke:var(--mute);stroke-width:1.4;transition:stroke .25s}
  .ret circle{fill:var(--mute);transition:fill .25s}
  .ret.lock svg{transform:scale(1) rotate(45deg)}
  .ret.lock path,.ret.lock circle{stroke:var(--key);fill:var(--key)}
  .ret .tag{position:absolute;left:46px;top:50%;transform:translate(6px,-50%);
    font-family:'Azeret Mono',ui-monospace,monospace;font-size:8.5px;letter-spacing:.26em;
    color:var(--ice);background:var(--sheet);border:1px solid var(--hair);
    padding:5px 8px;opacity:0;white-space:nowrap;
    transition:opacity .25s,transform .25s}
  .ret.lock .tag{transform:translate(0,-50%);opacity:.92}
  .ret .tag:empty{display:none}

  /* ── hud shell ────────────────────────────────────── */
  .hud{position:relative;z-index:3;height:100vh;height:100dvh;display:flex;flex-direction:column;
    justify-content:space-between;padding:clamp(20px,3vw,36px);pointer-events:none}
  .brackets{position:absolute;inset:0;pointer-events:none}
  .brackets i{position:absolute;width:24px;height:24px;border:1px solid var(--line)}
  .brackets .tl{left:clamp(12px,1.8vw,20px);top:clamp(12px,1.8vw,20px);border-right:0;border-bottom:0}
  .brackets .tr{right:clamp(12px,1.8vw,20px);top:clamp(12px,1.8vw,20px);border-left:0;border-bottom:0}
  .brackets .bl{left:clamp(12px,1.8vw,20px);bottom:clamp(12px,1.8vw,20px);border-right:0;border-top:0}
  .brackets .br{right:clamp(12px,1.8vw,20px);bottom:clamp(12px,1.8vw,20px);border-left:0;border-top:0}

  .hud a,.hud button{pointer-events:auto;text-decoration:none;color:inherit;
    font:inherit;background:none;border:0;-webkit-tap-highlight-color:transparent}
  .hud a:focus-visible,.hud button:focus-visible{outline:1px solid var(--ice);outline-offset:5px}

  /* ── top row ──────────────────────────────────────── */
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
  .mark{display:flex;align-items:flex-start;gap:12px}
  .mark-id{font-weight:700;font-size:12px;letter-spacing:.02em;
    color:var(--void);background:var(--ice);padding:5px 7px;line-height:1}
  .mark-name{display:block;font-weight:600;font-size:12.5px;letter-spacing:.16em;line-height:1.5;
    text-shadow:var(--tsh)}
  .mark-sub{display:block;font-family:'Azeret Mono',ui-monospace,monospace;font-weight:300;
    font-size:8.5px;letter-spacing:.24em;color:var(--mute);margin-top:3px;text-shadow:var(--tsh)}

  .navwrap{display:flex;align-items:flex-start;gap:8px}
  .menu{display:flex;gap:8px}
  .hud .menu a,.hud .menu button{position:relative;display:flex;align-items:center;gap:9px;
    padding:9px 14px 9px 12px;
    font-family:'Azeret Mono',ui-monospace,monospace;font-size:9.5px;letter-spacing:.2em;
    color:var(--mute);background:var(--plate);border:1px solid var(--hair);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    transition:color .22s,border-color .22s,background .22s;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%)}
  .hud .menu a i,.hud .menu button i{font-style:normal;font-size:8px;color:var(--dim);transition:color .22s}
  .hud .menu a::before,.hud .menu button::before{content:"";position:absolute;left:0;top:50%;width:1px;height:0;
    background:var(--void);transform:translateY(-50%);transition:height .25s}
  .hud .menu a:hover,.hud .menu a:focus-visible,
  .hud .menu button:hover,.hud .menu button:focus-visible{color:var(--void);background:var(--ice);border-color:var(--ice)}
  .hud .menu a:hover::before,.hud .menu button:hover::before{height:70%}
  .hud .menu a:hover i,.hud .menu button:hover i{color:var(--void)}
  .hud .menu a:active,.hud .menu button:active{background:var(--mute)}

  /* ── bottom row ───────────────────────────────────── */
  .bot{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;
    font-family:'Azeret Mono',ui-monospace,monospace;font-size:8.5px;letter-spacing:.18em}
  .readout{display:flex;flex-direction:column;gap:5px;color:var(--ice);text-shadow:var(--tsh)}
  .readout span{display:flex;gap:10px}
  .readout b{font-weight:400;color:var(--dim);min-width:66px}
  .readout em{font-style:normal}
  .tail{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .tools{display:flex;align-items:center;gap:8px}
  .hud .tgl{display:flex;align-items:center;gap:7px;color:var(--mute);background:var(--plate);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    font-family:'Azeret Mono',ui-monospace,monospace;font-size:8.5px;letter-spacing:.2em;
    border:1px solid var(--hair);padding:7px 10px;
    transition:color .25s,border-color .25s,background .25s;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%)}
  .hud .tgl i{font-style:normal;font-size:10px;line-height:1;color:var(--dim);transition:color .25s}
  .hud .tgl b{font-weight:400;min-width:34px;text-align:left}
  .hud .tgl:hover{color:var(--ice);border-color:var(--line)}
  .hud .tgl:hover i{color:var(--ice)}
  .hud .sound{display:flex;align-items:center;gap:7px;color:var(--mute);background:var(--plate);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    font-family:'Azeret Mono',ui-monospace,monospace;font-size:8.5px;letter-spacing:.2em;
    border:1px solid var(--hair);padding:7px 10px;transition:color .25s,border-color .25s;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%)}
  .hud .sound:hover{color:var(--ice);border-color:var(--line)}
  .hud .sound.live{color:var(--ice)}
  .bars{display:flex;align-items:flex-end;gap:2px;height:9px}
  .bars i{display:block;width:2px;height:3px;background:var(--dim);transition:background .3s}
  .sound.live .bars i{background:var(--ice);box-shadow:0 0 6px var(--glow);
    animation:vu 1.15s ease-in-out infinite}
  .sound.live .bars i:nth-child(2){animation-duration:.78s;animation-delay:.18s}
  .sound.live .bars i:nth-child(3){animation-duration:1.42s;animation-delay:.06s}
  .sound.live .bars i:nth-child(4){animation-duration:.94s;animation-delay:.3s}
  @keyframes vu{0%,100%{height:2px}50%{height:9px}}

  /* ── explore chips around the form ────────────────── */
  .explore{position:fixed;inset:0;z-index:4;pointer-events:none}
  .chip{position:absolute;transform:translate(-50%,-50%) scale(.82);
    display:flex;align-items:center;gap:9px;padding:9px 14px;
    font-family:'Azeret Mono',ui-monospace,monospace;font-size:9px;letter-spacing:.22em;
    color:var(--mute);background:var(--sheet);border:1px solid var(--hair);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;white-space:nowrap;
    clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
    transition:opacity .42s cubic-bezier(.2,.8,.3,1),transform .42s cubic-bezier(.2,.8,.3,1),
               color .25s,border-color .25s,background .25s}
  .chip i{font-style:normal;color:var(--dim);font-size:8px}
  .explore.on .chip{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
  .chip.hot{color:var(--void);background:var(--ice);border-color:var(--ice);
    transform:translate(-50%,-50%) scale(1.06)}
  .chip.hot i{color:var(--void)}

  /* ── work panel ───────────────────────────────────── */
  .panel{position:fixed;top:0;right:0;bottom:0;z-index:7;
    width:min(560px,48vw);display:flex;flex-direction:column;
    background:var(--sheet);border-left:1px solid var(--hair);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    transform:translateX(102%);opacity:0;visibility:hidden;
    transition:transform .62s cubic-bezier(.16,.84,.28,1),opacity .5s ease,visibility .62s}
  .panel.on{transform:none;opacity:1;visibility:visible}
  .panel-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding:16px clamp(16px,2.4vw,26px);border-bottom:1px solid var(--hair);
    font-family:'Azeret Mono',ui-monospace,monospace}
  .panel-title{display:flex;flex-direction:column;gap:4px}
  .panel-title b{font-weight:500;font-size:12px;letter-spacing:.24em;color:var(--ice)}
  .panel-title i{font-style:normal;font-size:8px;letter-spacing:.22em;color:var(--dim)}
  .panel-nav{display:flex;align-items:center;gap:6px}
  .pbtn{font-family:'Azeret Mono',ui-monospace,monospace;font-size:9px;letter-spacing:.18em;
    color:var(--mute);border:1px solid var(--hair);background:transparent;padding:8px 10px;
    transition:color .2s,background .2s,border-color .2s,opacity .3s}
  .pbtn:hover{color:var(--void);background:var(--ice);border-color:var(--ice)}
  .pbtn[hidden]{display:none}
  .panel-body{position:relative;flex:1;overflow:hidden}
  .view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;
    padding:clamp(16px,2.4vw,26px);
    transition:opacity .42s ease,transform .42s cubic-bezier(.2,.8,.3,1)}
  .view.hide{opacity:0;transform:translateY(14px);pointer-events:none}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{display:block;text-align:left;padding:0;border:1px solid var(--hair);background:transparent;
    opacity:0;transform:translateY(16px);
    transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.3,1),border-color .25s}
  .panel.on .card{opacity:1;transform:none}
  .card:hover{border-color:var(--line)}
  .card .thumb{position:relative;aspect-ratio:10/7;overflow:hidden;display:block}
  .card .thumb svg{width:100%;height:100%;display:block;transition:transform .55s cubic-bezier(.2,.8,.3,1)}
  .card:hover .thumb svg{transform:scale(1.05)}
  .card .meta{display:block;padding:13px 15px 14px;border-top:1px solid var(--hair);
    font-family:'Azeret Mono',ui-monospace,monospace;transition:border-color .25s}
  .card:hover .meta{border-color:var(--line)}
  .card .meta b{display:block;font-weight:500;font-size:9.5px;letter-spacing:.16em;
    line-height:1.5;color:var(--ice);overflow-wrap:anywhere}
  .card .meta span{display:block;margin-top:7px;font-size:8px;letter-spacing:.2em;
    line-height:1.5;color:var(--dim)}

  .page{display:flex;flex-direction:column;gap:22px}
  .page-hero{border:1px solid var(--hair);aspect-ratio:16/9;overflow:hidden}
  .who{display:flex;gap:18px;align-items:flex-start}
  .who .shot{position:relative;flex:0 0 auto;width:168px;border:1px solid var(--hair);
    overflow:hidden;line-height:0}
  .who .shot img{width:100%;aspect-ratio:1;object-fit:cover;display:block;
    filter:grayscale(1) contrast(1.04);transition:filter .5s ease,opacity .5s ease}
  body.light .who .shot img{filter:grayscale(1) contrast(1.02) brightness(1.02)}
  .who .shot::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,var(--scan) 0 1px,transparent 1px 3px);
    opacity:.5;mix-blend-mode:overlay}
  .who .shot i{position:absolute;left:0;bottom:0;right:0;font-style:normal;
    font-family:'Azeret Mono',ui-monospace,monospace;font-size:7px;letter-spacing:.22em;
    color:var(--ice);background:var(--sheet);border-top:1px solid var(--hair);
    padding:4px 6px;text-align:center;line-height:1.4}
  .who .said{flex:1;min-width:0}
  .page-hero svg{width:100%;height:100%;display:block}
  .page h3{font-weight:700;font-size:clamp(19px,2.3vw,26px);letter-spacing:-.01em;
    line-height:1.15;color:var(--ice)}
  .page p{font-size:12.5px;line-height:1.6;color:var(--mute)}
  .page p + p{margin-top:9px}
  .block{display:flex;flex-direction:column;gap:8px;
    padding-top:18px;border-top:1px solid var(--hair)}
  .block > b{font-family:'Azeret Mono',ui-monospace,monospace;font-weight:400;
    font-size:8px;letter-spacing:.26em;color:var(--dim)}
  .rows{display:flex;flex-direction:column}
  .rows a,.rows span{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
    padding:11px 0;border-bottom:1px solid var(--hair);text-decoration:none;
    font-family:'Azeret Mono',ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;
    color:var(--ice);transition:color .2s,padding-left .25s}
  .rows a:hover{color:var(--dim);padding-left:8px}
  .rows em{font-style:normal;color:var(--dim);font-size:8.5px;letter-spacing:.2em;text-align:right}
  .lede{font-size:13.5px;line-height:1.6;color:var(--mute)}
  .mail{font-weight:700;font-size:clamp(17px,2.4vw,25px);letter-spacing:-.01em;
    color:var(--ice);text-decoration:none;word-break:break-all}
  .mail:hover{color:var(--dim)}
  .clients{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .client{border:1px solid var(--hair);display:flex;flex-direction:column;gap:0;
    transition:border-color .25s}
  .client:hover{border-color:var(--line)}
  .client svg{width:100%;aspect-ratio:3/2;display:block}
  .client b{font-family:'Azeret Mono',ui-monospace,monospace;font-weight:400;font-size:7.5px;
    letter-spacing:.18em;color:var(--dim);padding:0 0 9px;text-align:center}
  .note{font-family:'Azeret Mono',ui-monospace,monospace;font-size:8px;letter-spacing:.2em;
    color:var(--dim);line-height:1.8}

  .detail-img{border:1px solid var(--hair);aspect-ratio:10/7;overflow:hidden}
  .detail-img svg{width:100%;height:100%;display:block}
  .detail-head{margin:16px 0 4px;font-weight:700;font-size:clamp(20px,2.6vw,28px);
    letter-spacing:-.01em;line-height:1.05;color:var(--ice)}
  .detail-sub{font-family:'Azeret Mono',ui-monospace,monospace;font-size:8.5px;
    letter-spacing:.22em;color:var(--dim);margin-bottom:16px}
  .info{border:1px solid var(--hair);background:var(--plate);padding:14px 16px;
    display:flex;flex-direction:column;gap:12px}
  .info div{display:flex;flex-direction:column;gap:5px}
  .info b{font-family:'Azeret Mono',ui-monospace,monospace;font-weight:400;
    font-size:8px;letter-spacing:.26em;color:var(--dim)}
  .info p{font-size:12.5px;line-height:1.55;color:var(--mute)}
  .info .row{flex-direction:row;gap:26px;flex-wrap:wrap}
  .info .row div{gap:4px}
  .info .row p{font-family:'Azeret Mono',ui-monospace,monospace;font-size:9.5px;
    letter-spacing:.14em;color:var(--ice)}

  /* ── real project media ───────────────────────────── */
  .card .thumb img{width:100%;height:100%;object-fit:cover;display:block;
    filter:grayscale(1) contrast(1.04);
    transition:transform .55s cubic-bezier(.2,.8,.3,1),filter .55s ease}
  .card:hover .thumb img,.card:focus-visible .thumb img{filter:none;transform:scale(1.05)}

  .detail-img{position:relative}
  .detail-img img{width:100%;height:100%;object-fit:cover;display:block}
  .detail-img::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
    background:repeating-linear-gradient(to bottom,var(--scan) 0 1px,transparent 1px 3px);
    opacity:.45;mix-blend-mode:overlay}
  .play{position:absolute;left:50%;top:50%;z-index:2;transform:translate(-50%,-50%);
    display:flex;align-items:center;gap:10px;padding:11px 16px 11px 13px;
    font-family:'Azeret Mono',ui-monospace,monospace;font-size:9px;letter-spacing:.22em;
    color:var(--ice);background:var(--sheet);border:1px solid var(--line);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);text-decoration:none;
    white-space:nowrap;
    clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
    transition:color .25s,background .25s,border-color .25s,transform .3s cubic-bezier(.2,.8,.3,1)}
  .play svg{width:10px;height:10px;display:block;fill:currentColor}
  .play:hover,.play:focus-visible{color:var(--void);background:var(--ice);border-color:var(--ice);
    transform:translate(-50%,-50%) scale(1.06)}

  .info a{color:var(--ice);text-decoration:none;border-bottom:1px solid var(--line);
    transition:color .2s,border-color .2s}
  .info a:hover{color:var(--dim);border-color:var(--dim)}
  .info p + p{margin-top:4px}
  .info .tags{display:flex;flex-direction:row;flex-wrap:wrap;gap:6px}
  .info .tags span{font-family:'Azeret Mono',ui-monospace,monospace;font-size:8.5px;
    letter-spacing:.16em;color:var(--mute);border:1px solid var(--hair);padding:5px 8px;
    transition:border-color .25s,color .25s}
  .info .tags span:hover{border-color:var(--line);color:var(--ice)}

  /* no pointer to hover with — show the artwork as it is */
  @media (hover:none){
    .card .thumb img{filter:none}
  }

  /* ── boot ─────────────────────────────────────────── */
  .boot{position:fixed;inset:0;z-index:10;background:var(--void);display:grid;place-items:center;
    transition:opacity .6s ease,visibility .6s}
  .boot.gone{opacity:0;visibility:hidden}
  .boot-in{width:min(280px,60vw);display:flex;flex-direction:column;gap:11px;
    font-family:'Azeret Mono',ui-monospace,monospace;font-size:8.5px;letter-spacing:.28em}
  .boot-t{color:var(--ice)}
  .boot-bar{height:2px;background:var(--hair);overflow:hidden}
  .boot-bar i{display:block;height:100%;width:0;background:var(--ice);box-shadow:0 0 12px var(--glow)}
  .boot-s{display:flex;justify-content:space-between;color:var(--dim)}
  .boot-s b{font-weight:400;color:var(--ice)}

  @media (max-width:900px){
    .panel{width:100%;border-left:0}
    .grid{grid-template-columns:1fr}
    .card .meta{padding:14px 16px 15px}
    .panel-bar{padding:14px 16px}
    .view{padding:16px 16px max(20px,env(safe-area-inset-bottom))}
    .detail-head{font-size:22px;margin-top:14px}
    .who .shot{width:132px}
    .info p{font-size:12px}
  }
  @media (max-width:860px){
    .top{flex-direction:column;gap:16px}
    .bot{flex-direction:column;align-items:flex-start;gap:14px}
    .tail{align-items:flex-start}
    .readout span:nth-child(3){display:none}
  }

  /* ── small screens ────────────────────────────────── */
  @media (max-width:720px){
    .hud{padding:14px 14px max(14px,env(safe-area-inset-bottom))}
    .brackets{display:none}
    .top{gap:12px}
    .mark{gap:9px;align-items:center}
    .mark-id{font-size:10px;padding:4px 6px}
    .mark-name{font-size:10.5px;letter-spacing:.13em}
    .mark-sub{font-size:7.5px;letter-spacing:.2em;margin-top:2px}
    .menu{gap:6px}
    .hud .menu a,.hud .menu button{padding:8px 11px;font-size:8.5px;letter-spacing:.14em;gap:0}
    .hud .menu a i,.hud .menu button i{display:none}

    .bot{flex-direction:column-reverse;align-items:stretch;gap:12px}
    .tail{align-items:stretch}
    .tools{justify-content:space-between}
    .readout{font-size:8px;gap:4px}
    .readout b{min-width:58px}
    .readout span:nth-child(2){display:none}

    /* the ring flattens into a strip you can thumb through */
    .explore{top:auto;left:0;right:0;height:auto;
      display:flex;gap:8px;align-items:center;padding:0 14px;
      overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}
    .explore::-webkit-scrollbar{display:none}
    .explore.on{pointer-events:auto}
    .chip{position:static;flex:0 0 auto;padding:10px 14px;font-size:9px;
      transform:translateY(12px)}
    .explore.on .chip{transform:none}
    .chip.hot{transform:none}
    .who{flex-direction:column;gap:14px}
    .who .shot{width:150px}
    .clients{grid-template-columns:repeat(2,1fr)}
  }

  @media (max-width:420px){
    .mark-sub{display:none}
    .hud .menu a,.hud .menu button{padding:8px 9px;font-size:8px}
    .hud .tgl b{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .sweep,.sound.live .bars i{animation:none}
  }
</style>
</head>

function envScene(cfg){
  const s = new THREE.Scene();
  s.background = new THREE.Color(cfg.back);
  const pg = new THREE.PlaneGeometry(1,1);
  const bar = (x,y,z,sx,sy,rx,ry,hex,mul)=>{
    const m = new THREE.Mesh(pg, new THREE.MeshBasicMaterial({ color:new THREE.Color(hex).multiplyScalar(mul), side:THREE.DoubleSide }));
    m.position.set(x,y,z); m.scale.set(sx,sy,1); m.rotation.set(rx,ry,0); s.add(m);
  };
  bar(0, 6, 0, 14, 8, Math.PI/2, 0, 0xffffff, cfg.key);
  bar(-6, 0.5, 1, 3.2, 9, 0, Math.PI/2, 0xf2f4f5, cfg.fill);
  bar(6, -0.5, -1, 2.4, 8, 0, -Math.PI/2, 0xaab6bd, cfg.rim);
  bar(0, -5, 2, 12, 6, -Math.PI/2, 0, 0x3a3e41, cfg.floor);
  bar(0, 0, -8, 16, 12, 0, 0, 0x1a1c1e, cfg.wall);
  return s;
}

let grainPattern = null;
function makeGrain(){
  const n = document.createElement('canvas'); n.width = n.height = 180;
  const g = n.getContext('2d');
  const img = g.createImageData(180,180);
  for(let i=0;i<img.data.length;i+=4){
    const v = 90 + Math.random()*130;
    img.data[i] = img.data[i+1] = img.data[i+2] = v;
    img.data[i+3] = Math.random()*46;
  }
  g.putImageData(img,0,0);
  document.getElementById('grain').style.backgroundImage = 'url('+n.toDataURL()+')';
  grainPattern = n;
}
makeGrain();

function drawPoster(w, h, dpr){
  const P = TH().poster;
  posterCanvas.width = Math.round(w*dpr); posterCanvas.height = Math.round(h*dpr);
  pctx.setTransform(dpr,0,0,dpr,0,0);
  pctx.clearRect(0,0,w,h);
  pctx.fillStyle = P.bg; pctx.fillRect(0,0,w,h);

  const glow = pctx.createRadialGradient(w/2, h*0.46, 0, w/2, h*0.46, Math.max(w,h)*0.6);
  glow.addColorStop(0, P.glow[0]);
  glow.addColorStop(0.45, P.glow[1]);
  glow.addColorStop(1, P.glow[2]);
  pctx.fillStyle = glow; pctx.fillRect(0,0,w,h);

  const step = Math.max(52, Math.round(Math.min(w,h)/14));
  pctx.lineWidth = 1;
  for(let i=0, x=w/2%step; x<w; x+=step, i++){
    pctx.strokeStyle = i%5===0 ? P.g1 : P.g2;
    pctx.beginPath(); pctx.moveTo(Math.round(x)+.5,0); pctx.lineTo(Math.round(x)+.5,h); pctx.stroke();
  }
  for(let i=0, y=h/2%step; y<h; y+=step, i++){
    pctx.strokeStyle = i%5===0 ? P.g1 : P.g2;
    pctx.beginPath(); pctx.moveTo(0,Math.round(y)+.5); pctx.lineTo(w,Math.round(y)+.5); pctx.stroke();
  }

  pctx.strokeStyle = P.rule;
  pctx.beginPath(); pctx.moveTo(0, Math.round(h*0.74)+.5); pctx.lineTo(w, Math.round(h*0.74)+.5); pctx.stroke();

  if(grainPattern){
    const pat = pctx.createPattern(grainPattern,'repeat');
    pctx.globalAlpha = P.grain; pctx.globalCompositeOperation = 'overlay';
    pctx.fillStyle = pat; pctx.fillRect(0,0,w,h);
    pctx.globalAlpha = 1; pctx.globalCompositeOperation = 'source-over';
  }
  posterTex.needsUpdate = true;
}

  mat.transparent = true;

    sh.uniforms.uC = uC; sh.uniforms.uR1 = uR1; sh.uniforms.uR2 = uR2;
    sh.uniforms.uPC = uPC; sh.uniforms.uPR = uPR; sh.uniforms.uPI = uPI;
    sh.uniforms.uKeyC = uKeyC;
    sh.vertexShader = 'varying vec3 vWP;\nvarying vec3 vOP;\n' + sh.vertexShader.replace(
      '#include <project_vertex>',
      '#include <project_vertex>\n  vWP = (modelMatrix * vec4(transformed, 1.0)).xyz;\n  vOP = transformed;'
    );
    const band = mode2 === 'in'
      ? 'a = 1.0 - smoothstep(uR1 - 0.13, uR1 + 0.13, d);'
      : mode2 === 'out'
        ? 'a = smoothstep(uR1 - 0.13, uR1 + 0.13, d);'
        : 'a = smoothstep(uR1 - 0.16, uR1 + 0.10, d) * (1.0 - smoothstep(uR2 - 0.16, uR2 + 0.16, d));';
    const wave =
      '\n  float pd = distance(vOP, uPC);' +
      '\n  float ring = exp(-pow((pd - uPR) / 0.21, 2.0)) * uPI;' +
      '\n  float wake = (1.0 - smoothstep(uPR - 0.5, uPR, pd)) * uPI * 0.22;' +
      '\n  diffuseColor.a = clamp(diffuseColor.a + ring * 0.92 + wake, 0.0, 1.0);' +
      '\n  diffuseColor.rgb = mix(diffuseColor.rgb, uKeyC, clamp(ring * 1.25, 0.0, 1.0));';
    sh.fragmentShader =
      'varying vec3 vWP;\nvarying vec3 vOP;\nuniform vec3 uC;\nuniform float uR1;\nuniform float uR2;\n' +
      'uniform vec3 uPC;\nuniform float uPR;\nuniform float uPI;\nuniform vec3 uKeyC;\n' + sh.fragmentShader.replace(
      '#include <color_fragment>',
      '#include <color_fragment>\n  float d = distance(vWP, uC);\n  float a;\n  ' + band +
      '\n  diffuseColor.a *= max(a, 0.0);' + wave
    );
  };
  return mat;
}

/* ══ particle field — small dots, not squares ═════════════════════════════ */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(0x5eed1);
const CELL = 0.335;
const DOT = 0.19;                       // fraction of a cell — tiny
const blocks = [];
const dummy = new THREE.Object3D();
let field = null;

function buildField(){
  for(let gx=-11; gx<=11; gx++){
    for(let gy=-7; gy<=7; gy++){
      const x = gx*CELL, y = gy*CELL;
      const r = Math.hypot(x*0.82, y*0.95);
      let p = 0.34*Math.exp(-((r-2.45)*(r-2.45))/(2*0.85*0.85));
      p *= THREE.MathUtils.clamp(0.20 + 0.80*Math.sin(x*1.9+0.6)*Math.cos(y*1.55-0.9), 0, 1);
      if(r > 3.3) p *= 0.12;
      if(rng() > p) continue;
      blocks.push({
        x, y, z: -0.75 - rng()*1.1,
        phase: rng()*Math.PI*2,
        speed: 0.5 + rng()*1.6,
        blink: rng() > 0.95,
        born: rng()*0.5
      });
    }
  }
  field = new THREE.InstancedMesh(
    new THREE.CircleGeometry(0.5, 10),
    new THREE.MeshBasicMaterial({ transparent:true, opacity:TH().fieldOp, depthWrite:false }),
    blocks.length
  );
  field.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const c = new THREE.Color(TH().field);
  blocks.forEach((b,i)=>field.setColorAt(i, c));
  field.instanceColor.needsUpdate = true;
  scene.add(field);
}
buildField();

const tmp = new THREE.Vector3();
function updateField(ease, t, waveC, waveR, waveI){
  const size = CELL * DOT;
  for(let i=0;i<blocks.length;i++){
    const b = blocks[i];
    tmp.set(b.x, b.y, b.z);
    const d = tmp.distanceTo(uC.value);

    let s = 0.22 + 0.78 * THREE.MathUtils.smoothstep(d, uR1.value - 0.25, uR1.value + 0.45);
    const ring = Math.max(0, 1 - Math.abs(d - uR2.value)/0.75);
    s *= 1 + 0.34*ring;
    if(!reduce){
      s *= 0.94 + 0.06*Math.sin(t*b.speed + b.phase);
      if(b.blink && Math.sin(t*0.9 + b.phase) > 0.86) s *= 0.12;
    }
    if(waveI > 0){
      const wd = tmp.distanceTo(waveC);
      s *= 1 + 1.5 * waveI * Math.exp(-Math.pow((wd - waveR)/0.4, 2));
    }
    s *= THREE.MathUtils.clamp((ease - b.born) / 0.45, 0, 1);

    dummy.position.set(b.x, b.y, b.z);
    dummy.scale.set(size*s, size*s, 1);
    dummy.updateMatrix();
    field.setMatrixAt(i, dummy.matrix);
  }
  field.instanceMatrix.needsUpdate = true;
}

/* ══ the form ═════════════════════════════════════════════════════════════ */
const group = new THREE.Group();
scene.add(group);

let ORDER = ['a','o','waw'];          // the cycle: click steps one place along
const forms = {};
let matte, glass, outline, wire, ready = false;
let curIx = 0;

// the letters ship pre-fitted to a shared cap height, so only the fallback
// outline ever needs scaling
function normalize(geo){
  geo.computeBoundingBox();
  const size = geo.boundingBox.getSize(new THREE.Vector3());
  const mid  = geo.boundingBox.getCenter(new THREE.Vector3());
  geo.translate(-mid.x, -mid.y, -mid.z);
  const k = FIT / Math.max(size.x, size.y);
  geo.scale(k,k,k);
  geo.computeBoundingBox(); geo.computeBoundingSphere();
  return geo;
}

// the frame has to hold the widest letter, or 'o' would clip on the turn
function measure(){
  let w = 0, h = 0;
  for(const k of ORDER){
    const f = forms[k];
    if(!f) continue;
    const s = f.geo.boundingBox.getSize(new THREE.Vector3());
    w = Math.max(w, s.x); h = Math.max(h, s.y);
  }
  if(w > 0){ letterW = w; letterH = h; }
}

function flatten(root){
  const parts = [];
  root.updateWorldMatrix(true, true);
  root.traverse(o=>{
    if(!o.isMesh) return;
    const g = o.geometry.clone().applyMatrix4(o.matrixWorld);
    for(const key of Object.keys(g.attributes)){
      if(key !== 'position' && key !== 'normal') g.deleteAttribute(key);
    }
    if(!g.attributes.normal) g.computeVertexNormals();
    parts.push(g.toNonIndexed());
  });
  if(!parts.length) return null;
  return parts.length === 1 ? parts[0] : BufferGeometryUtils.mergeGeometries(parts, false);
}

function svgFallback(){
  const shapes = SVGLoader.createShapes(new SVGLoader().parse(
    '<svg viewBox="0 0 70.72 100.32"><path d="'+D+'"/></svg>').paths[0]);
  const g = new THREE.ExtrudeGeometry(shapes, {
    depth:17, curveSegments:26, bevelEnabled:true, bevelThickness:1.7, bevelSize:1.3, bevelSegments:6
  });
  g.rotateX(Math.PI);
  g.computeVertexNormals();
  return normalize(g);
}

// four layers per letter — matte body, sharp outline, wireframe, glass shell
function buildForm(key, geo){
  const T = TH();
  geo.computeBoundingBox(); geo.computeBoundingSphere();
  const root = new THREE.Group();

  const m = new THREE.Mesh(geo, zoneify(new THREE.MeshStandardMaterial({
    color:T.matte, roughness:T.matteRough, metalness:T.matteMetal, envMapIntensity:1.15
  }), 'out'));
  m.renderOrder = 1;
  root.add(m);

  const o = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 20), new THREE.LineBasicMaterial({
    color:T.line, transparent:true, opacity:T.lineOp, depthWrite:false
  }));
  o.scale.setScalar(1.002);
  o.renderOrder = 2;
  root.add(o);

  const w = new THREE.LineSegments(new THREE.WireframeGeometry(geo), zoneify(new THREE.LineBasicMaterial({
    color:T.line, depthWrite:false
  }), 'band'));
  w.scale.setScalar(1.006);
  w.renderOrder = 3;
  root.add(w);

  const depth = geo.boundingBox.getSize(new THREE.Vector3()).z;
  const g = new THREE.Mesh(geo, zoneify(new THREE.MeshPhysicalMaterial({
    color:0xffffff, metalness:0, roughness:0.02, transmission:1,
    thickness:Math.max(depth,0.6), ior:1.6, clearcoat:1, clearcoatRoughness:0.02,
    iridescence:0.3, iridescenceIOR:1.28, iridescenceThicknessRange:[180,420],
    envMapIntensity:1.7, depthWrite:false
  }), 'in'));
  g.scale.setScalar(1.004);
  g.renderOrder = 4;
  root.add(g);

  root.visible = false;
  group.add(root);
  forms[key] = { root, matte:m, outline:o, wire:w, glass:g, geo, fade:0 };
}

// the shared handles the rest of the page already talks to always point at
// whichever letter is currently standing
function useForm(ix){
  curIx = ((ix % ORDER.length) + ORDER.length) % ORDER.length;
  const f = forms[ORDER[curIx]];
  if(!f) return;
  matte = f.matte; outline = f.outline; wire = f.wire; glass = f.glass;
  for(const k of ORDER) if(forms[k]) forms[k].fade = 0;
  f.fade = 1;
}

function applyFades(ease){
  const T = TH();
  for(const k of ORDER){
    const f = forms[k];
    if(!f) continue;
    const v = f.fade;
    f.root.visible = v > 0.004;
    if(!f.root.visible) continue;
    f.matte.material.opacity   = v;
    f.wire.material.opacity    = v;
    f.outline.material.opacity = T.lineOp * ease * v;
    f.glass.visible            = v > 0.9;      // transmission doesn't fade cleanly
    f.glass.material.opacity   = v;
    f.root.scale.setScalar(0.986 + 0.014*v);   // the solid contracts a hair as it lets go
  }
}

/* ══ dust: how one letter becomes the next ════════════════════════════════ */
// Each letter is sampled into the same number of grains. A kd-tree walks both
// clouds down the same splits, so grain n of one letter is paired with the
// grain of the next letter that occupies the same corner of the shape — the
// swarm shifts rather than scatters, which is what makes the change readable.

const PN = 20000;                 // grains
const MORPH_T = reduce ? 0.85 : 1.45;
const clouds = {};
const links = {};                 // 'a>o' -> Int32Array pairing
let dust = null, dustMat = null, dustReady = false;
let morph = null, queued = 0, pop = 0, popT = -1;

function sampleCloud(geo, seed){
  const s = new MeshSurfaceSampler(new THREE.Mesh(geo, new THREE.MeshBasicMaterial())).build();
  s.randomFunction = mulberry32(seed);
  const pos = new Float32Array(PN*3), nrm = new Float32Array(PN*3);
  const p = new THREE.Vector3(), n = new THREE.Vector3();
  for(let i=0;i<PN;i++){
    s.sample(p, n);
    pos[i*3] = p.x; pos[i*3+1] = p.y; pos[i*3+2] = p.z;
    nrm[i*3] = n.x; nrm[i*3+1] = n.y; nrm[i*3+2] = n.z;
  }
  return { pos, nrm };
}

// recursive median split of both clouds at once — O(n log n), and the halves
// always correspond, so nothing has to cross the letter to reach its place
function kdPair(A, B){
  const n = A.length/3;
  const ia = new Int32Array(n), ib = new Int32Array(n), perm = new Int32Array(n);
  for(let i=0;i<n;i++){ ia[i] = i; ib[i] = i; }

  function span(arr, idx, lo, hi, ax){
    let mn = Infinity, mx = -Infinity;
    for(let k=lo;k<hi;k++){ const v = arr[idx[k]*3+ax]; if(v<mn) mn=v; if(v>mx) mx=v; }
    return mx - mn;
  }
  function select(arr, idx, lo, hi, ax, k){
    while(hi - lo > 1){
      const pivot = arr[idx[(lo+hi)>>1]*3+ax];
      let i = lo, j = hi-1;
      while(i <= j){
        while(arr[idx[i]*3+ax] < pivot) i++;
        while(arr[idx[j]*3+ax] > pivot) j--;
        if(i <= j){ const t = idx[i]; idx[i] = idx[j]; idx[j] = t; i++; j--; }
      }
      if(k <= j) hi = j+1;
      else if(k >= i) lo = i;
      else return;
    }
  }

  const stack = [[0,n,0,n]];
  while(stack.length){
    const s = stack.pop();
    const a0 = s[0], a1 = s[1], b0 = s[2], b1 = s[3];
    const c = a1 - a0;
    if(c === 1){ perm[ia[a0]] = ib[b0]; continue; }
    let ax = 0, best = -1;
    for(let k=0;k<3;k++){
      const e = span(A,ia,a0,a1,k) + span(B,ib,b0,b1,k);
      if(e > best){ best = e; ax = k; }
    }
    const mid = c >> 1;
    select(A, ia, a0, a1, ax, a0+mid);
    select(B, ib, b0, b1, ax, b0+mid);
    stack.push([a0, a0+mid, b0, b0+mid]);
    stack.push([a0+mid, a1, b0+mid, b1]);
  }
  return perm;
}

const DUST_VERT = `
attribute vec3 aTo;
attribute vec3 aNrm;
attribute vec2 aRnd;
uniform float uT;
uniform float uFade;
uniform float uSize;
uniform float uPx;
uniform float uLift;
uniform float uSwirl;
uniform float uPuff;
uniform vec3  uHit;
varying float vG;

void main(){
  // grains nearest the strike let go first, the far side hangs on
  float sweep = clamp(distance(position, uHit) / 3.2, 0.0, 1.0);
  float d = mix(sweep, aRnd.x, 0.45) * 0.34;
  float k = clamp((uT - d) / 0.66, 0.0, 1.0);

  float e = k*k*k*(k*(k*6.0 - 15.0) + 10.0);        // smootherstep
  float b = sin(k * 3.14159265);                     // 0 → 1 → 0 across the flight
  b = b*b*(3.0 - 2.0*b);

  vec3 p = mix(position, aTo, e);
  p += aNrm * (b * uLift * (0.45 + aRnd.y));         // lift off the surface
  p *= 1.0 + b * uPuff;                              // and breathe outward

  float ang = b * uSwirl * (0.55 + aRnd.y);          // twist about the standing axis
  float ca = cos(ang), sa = sin(ang);
  vec2 q = p.xz;
  p.x = q.x*ca - q.y*sa;
  p.z = q.x*sa + q.y*ca;

  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  gl_Position = projectionMatrix * mv;
  float ps = uSize * (0.55 + aRnd.y) * (1.0 + b*0.9) * uPx / max(0.02, -mv.z);
  gl_PointSize = clamp(ps, 1.0, 20.0);
  vG = uFade * (0.55 + 0.45*b);
}
`;

const DUST_FRAG = `
uniform vec3 uCol;
varying float vG;
void main(){
  vec2 q = gl_PointCoord - 0.5;
  float r = dot(q, q);
  if(r > 0.25) discard;
  gl_FragColor = vec4(uCol, smoothstep(0.25, 0.05, r) * vG);
}
`;

function dustColor(){
  // written straight to the framebuffer, so keep the theme colour in display space
  const c = new THREE.Color();
  c.setHex(TH().key, THREE.LinearSRGBColorSpace);
  return c;
}

function buildDust(){
  if(dustReady || ORDER.length < 2) return;

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(PN*3), 3));
  g.setAttribute('aTo',      new THREE.BufferAttribute(new Float32Array(PN*3), 3));
  g.setAttribute('aNrm',     new THREE.BufferAttribute(new Float32Array(PN*3), 3));
  const rnd = new Float32Array(PN*2);
  const r = mulberry32(0x9e3779b);
  for(let i=0;i<PN;i++){ rnd[i*2] = r(); rnd[i*2+1] = r(); }
  g.setAttribute('aRnd', new THREE.BufferAttribute(rnd, 2));
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 6);

  dustMat = new THREE.ShaderMaterial({
    uniforms:{
      uT:{value:0}, uFade:{value:0}, uSize:{value:0.015}, uPx:{value:900},
      uLift:{value:reduce?0.12:0.34}, uSwirl:{value:reduce?0.12:0.42}, uPuff:{value:reduce?0.03:0.10},
      uHit:{value:new THREE.Vector3()}, uCol:{value:dustColor()}
    },
    vertexShader:DUST_VERT, fragmentShader:DUST_FRAG,
    transparent:true, depthWrite:false, toneMapped:false,
    blending: TH().additive ? THREE.AdditiveBlending : THREE.NormalBlending
  });

  dust = new THREE.Points(g, dustMat);
  dust.frustumCulled = false;
  dust.renderOrder = 6;
  dust.visible = false;
  group.add(dust);

  // sampling and pairing are chunked so the first frames after boot stay smooth
  const jobs = [];
  ORDER.forEach((k,i)=> jobs.push(()=>{ clouds[k] = sampleCloud(forms[k].geo, 9001 + i*331); }));
  ORDER.forEach((k,i)=>{
    const b = ORDER[(i+1) % ORDER.length];
    jobs.push(()=>{ links[k+'>'+b] = kdPair(clouds[k].pos, clouds[b].pos); });
  });
  jobs.push(()=>{
    dustReady = true;
    syncDust();
    if(queued){ queued = 0; startMorph(null); }   // a click that beat the dust here
  });

  (function next(){
    const job = jobs.shift();
    if(!job) return;
    try{ job(); }catch(e){ return; }
    setTimeout(next, 0);
  })();
}

function syncDust(){
  if(!dustMat) return;
  dustMat.uniforms.uCol.value.copy(dustColor());
  dustMat.blending = TH().additive ? THREE.AdditiveBlending : THREE.NormalBlending;
  dustMat.needsUpdate = true;
}

function sizeDust(){
  if(dustMat) dustMat.uniforms.uPx.value =
    VH * Math.min(devicePixelRatio, 2) / (2*Math.tan(FOV*Math.PI/360));
}

// load the grain buffers for one step of the cycle
function armDust(from, to, hit){
  const A = clouds[from], B = clouds[to], perm = links[from+'>'+to];
  if(!A || !B || !perm) return false;
  const g = dust.geometry;
  const p = g.attributes.position.array, t = g.attributes.aTo.array, n = g.attributes.aNrm.array;
  p.set(A.pos); n.set(A.nrm);
  for(let i=0;i<PN;i++){
    const j = perm[i]*3, o = i*3;
    t[o] = B.pos[j]; t[o+1] = B.pos[j+1]; t[o+2] = B.pos[j+2];
  }
  g.attributes.position.needsUpdate = true;
  g.attributes.aTo.needsUpdate = true;
  g.attributes.aNrm.needsUpdate = true;
  dustMat.uniforms.uHit.value.copy(hit || new THREE.Vector3());
  dustMat.uniforms.uT.value = 0;
  dustMat.uniforms.uFade.value = 0;
  return true;
}

function startMorph(hit){
  if(!ready || ORDER.length < 2) return;
  if(morph){ queued = 1; return; }              // a click mid-flight still counts
  if(!dustReady){ queued = 1; return; }         // the grains are still being cut

  const from = ORDER[curIx], to = ORDER[(curIx+1) % ORDER.length];
  if(!armDust(from, to, hit)) return;

  morph = { t:0, from, to, sealed:false };
  dust.visible = true;
  forms[from].fade = 1;
  forms[to].fade = 0;
  spinV += (reduce ? 0.006 : 0.019);            // a nudge, so the turn carries through
  morphSound();
}

function stepMorph(dt){
  if(!morph) return;
  morph.t += dt;
  const k = Math.min(1, morph.t / MORPH_T);
  const u = dustMat.uniforms;
  u.uT.value = k;
  u.uFade.value = Math.min(sstep(k/0.09), sstep((1-k)/0.14));

  forms[morph.from].fade = 1 - sstep(k/0.17);
  forms[morph.to].fade   = sstep((k - 0.80)/0.20);

  if(!morph.sealed && k > 0.83){                // a ring closes over the new letter
    morph.sealed = true;
    spawnRing(new THREE.Vector3(0,0,0.34), new THREE.Vector3(0,0,1), 0);
    chime();
  }
  if(k >= 1){
    const to = morph.to;
    morph = null;
    dust.visible = false;
    useForm(ORDER.indexOf(to));
    pop = 0; popT = 0;
    if(queued){ queued = 0; startMorph(null); }
  }
}

function sstep(x){
  x = Math.min(1, Math.max(0, x));
  return x*x*(3 - 2*x);
}

/* ══ audio ════════════════════════════════════════════════════════════════ */
// everything here is synthesised in the browser — no audio files, nothing streamed.
// nothing is armed until the visitor actually interacts.
let actx = null, soundOn = true, started = false;
let master = null, ambientBus = null, sfxBus = null, verb = null, startedAt = 0;
let chordTimer = null, bellTimer = null, chordIx = 0;
const AMB = 0.17;

function ctx(){
  if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if(actx.state === 'suspended') actx.resume();
  return actx;
}
function outBus(){ return sfxBus || ctx().destination; }

function makeIR(seconds, decay){
  const ac = ctx(), len = Math.floor(ac.sampleRate * seconds);
  const buf = ac.createBuffer(2, len, ac.sampleRate);
  for(let c=0;c<2;c++){
    const d = buf.getChannelData(c);
    for(let i=0;i<len;i++){
      const t = i/len;
      d[i] = (Math.random()*2-1) * Math.pow(1-t, decay) * (i < 240 ? i/240 : 1);
    }
  }
  return buf;
}

const CHORDS = [
  [110.00, 164.81, 196.00, 246.94],
  [ 87.31, 130.81, 164.81, 220.00],
  [130.81, 196.00, 246.94, 329.63],
  [ 82.41, 123.47, 146.83, 196.00]
];
const BELLS = [440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];

function scheduleChord(first){
  const ac = ctx(), t = ac.currentTime;
  const notes = CHORDS[chordIx++ % CHORDS.length];
  const dur = 17, fade = first ? 1.6 : 4.0, out = 5.0;
  notes.forEach((f, i)=>{
    for(let u=0; u<2; u++){
      const o = ac.createOscillator();
      o.type = u ? 'triangle' : 'sawtooth';
      o.frequency.value = f * (1 + (Math.random()-0.5)*0.005);

      const lp = ac.createBiquadFilter();
      lp.type = 'lowpass'; lp.Q.value = 0.7;
      lp.frequency.value = 300 + i*110;

      const lfo = ac.createOscillator();
      lfo.frequency.value = 0.03 + Math.random()*0.05;
      const lfoG = ac.createGain(); lfoG.gain.value = 130;
      lfo.connect(lfoG); lfoG.connect(lp.frequency);

      const g = ac.createGain();
      const peak = (u ? 0.05 : 0.08) / (1 + i*0.4);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(peak, t + fade);
      g.gain.setValueAtTime(peak, t + dur - out);
      g.gain.linearRampToValueAtTime(0.0001, t + dur);

      o.connect(lp); lp.connect(g);
      g.connect(ambientBus); g.connect(verb);
      o.start(t); lfo.start(t);
      o.stop(t + dur + 1); lfo.stop(t + dur + 1);
    }
  });
}

function scheduleBell(){
  try{
    const ac = ctx(), t = ac.currentTime;
    const f = BELLS[Math.floor(Math.random()*BELLS.length)];
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 5.5);
    const o = ac.createOscillator();  o.type = 'sine';  o.frequency.value = f;
    const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2.004;
    const g2 = ac.createGain(); g2.gain.value = 0.22;
    o2.connect(g2); g2.connect(g); o.connect(g);
    let tail = g;
    if(ac.createStereoPanner){
      const pan = ac.createStereoPanner();
      pan.pan.value = Math.random()*1.4 - 0.7;
      g.connect(pan); tail = pan;
    }
    tail.connect(ambientBus); tail.connect(verb);
    o.start(t); o2.start(t); o.stop(t + 6); o2.stop(t + 6);
  }catch(e){}
  bellTimer = setTimeout(scheduleBell, (7 + Math.random()*9)*1000);
}

function buildAudio(){
  if(started) return;
  try{
    const ac = ctx();
    started = true; startedAt = performance.now();

    master = ac.createGain(); master.gain.value = 0.0001;
    master.connect(ac.destination);

    verb = ac.createConvolver(); verb.buffer = makeIR(4.5, 2.6);
    const verbGain = ac.createGain(); verbGain.gain.value = 0.9;
    verb.connect(verbGain); verbGain.connect(master);

    ambientBus = ac.createGain(); ambientBus.gain.value = AMB; ambientBus.connect(master);
    sfxBus = ac.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);

    [[55, 0.09], [82.41, 0.055]].forEach(([f, v], i)=>{
      const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = ac.createGain(); g.gain.value = v;
      const lfo = ac.createOscillator(); lfo.frequency.value = 0.05 + i*0.028;
      const lg = ac.createGain(); lg.gain.value = v*0.35;
      lfo.connect(lg); lg.connect(g.gain);
      o.connect(g); g.connect(ambientBus);
      o.start(); lfo.start();
    });

    const nb = ac.createBuffer(1, ac.sampleRate*4, ac.sampleRate);
    const nd = nb.getChannelData(0);
    for(let i=0;i<nd.length;i++) nd[i] = (Math.random()*2-1)*0.5;
    const src = ac.createBufferSource(); src.buffer = nb; src.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.8;
    const ng = ac.createGain(); ng.gain.value = 0.02;
    const nlfo = ac.createOscillator(); nlfo.frequency.value = 0.04;
    const nlg = ac.createGain(); nlg.gain.value = 520;
    nlfo.connect(nlg); nlg.connect(bp.frequency);
    src.connect(bp); bp.connect(ng); ng.connect(ambientBus); ng.connect(verb);
    src.start(); nlfo.start();

    scheduleChord(true);
    chordTimer = setInterval(scheduleChord, 15000);
    setTimeout(scheduleBell, 1500);

    // short fade — the bed is audible almost immediately
    master.gain.setTargetAtTime(soundOn ? 1 : 0, ac.currentTime, 0.35);
  }catch(e){ started = false; }
  paintSound();
  syncTag();
  refreshExplore();
}

function startAudio(){
  if(started) return;
  const ac = ctx();
  if(ac.state === 'running'){ buildAudio(); return; }
  const p = ac.resume();
  if(p && p.then) p.then(()=>{ if(ac.state === 'running') buildAudio(); }).catch(()=>{});
  else if(ac.state === 'running') buildAudio();
}

function duck(){
  if(!ambientBus) return;
  const ac = ctx(), t = ac.currentTime;
  ambientBus.gain.cancelScheduledValues(t);
  ambientBus.gain.setTargetAtTime(AMB*0.45, t, 0.05);
  ambientBus.gain.setTargetAtTime(AMB, t + 0.28, 0.7);
}

// the change of state gets its own two sounds: air on the way out, a tone on landing
function morphSound(){
  if(!soundOn || !started) return;
  try{
    const ac = ctx(), t = ac.currentTime;
    const len = Math.floor(ac.sampleRate * 1.5);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2 - 1;

    const src = ac.createBufferSource(); src.buffer = buf;
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 1.15;
    bp.frequency.setValueAtTime(220, t);
    bp.frequency.exponentialRampToValueAtTime(3400, t + 0.62);
    bp.frequency.exponentialRampToValueAtTime(380, t + 1.4);

    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.075, t + 0.20);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.42);

    src.connect(bp); bp.connect(g);
    g.connect(outBus());
    if(verb) g.connect(verb);
    src.start(t); src.stop(t + 1.5);
  }catch(e){}
}

function chime(){
  if(!soundOn || !started) return;
  try{
    const ac = ctx(), t = ac.currentTime;
    const f = BELLS[Math.floor(Math.random()*4)];
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.075, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);
    const o = ac.createOscillator();  o.type = 'sine';     o.frequency.value = f;
    const o2 = ac.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f*1.5;
    const g2 = ac.createGain(); g2.gain.value = 0.3;
    o2.connect(g2); g2.connect(g); o.connect(g);
    g.connect(outBus());
    if(verb) g.connect(verb);
    o.start(t); o2.start(t); o.stop(t + 2.8); o2.stop(t + 2.8);
  }catch(e){}
}

function boop(){
  if(!soundOn || !started) return;
  try{
    const ac = ctx(), t = ac.currentTime;
    const d = 1 + (Math.random() - 0.5) * 0.05;

    const out = ac.createGain();
    out.gain.setValueAtTime(0.0001, t);
    out.gain.exponentialRampToValueAtTime(0.26, t + 0.012);
    out.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);

    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2800, t);
    lp.frequency.exponentialRampToValueAtTime(700, t + 0.3);
    lp.Q.value = 6;

    const o1 = ac.createOscillator();
    o1.type = 'sine';
    o1.frequency.setValueAtTime(300 * d, t);
    o1.frequency.exponentialRampToValueAtTime(760 * d, t + 0.04);
    o1.frequency.exponentialRampToValueAtTime(430 * d, t + 0.24);

    const o2 = ac.createOscillator();
    o2.type = 'triangle';
    o2.frequency.setValueAtTime(1220 * d, t);
    o2.frequency.exponentialRampToValueAtTime(1720 * d, t + 0.05);
    const g2 = ac.createGain();
    g2.gain.setValueAtTime(0.11, t);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);

    o1.connect(lp); o2.connect(g2); g2.connect(lp);
    lp.connect(out); out.connect(outBus());
    if(verb){ const s = ac.createGain(); s.gain.value = 0.5; out.connect(s); s.connect(verb); }
    o1.start(t); o2.start(t); o1.stop(t + 0.38); o2.stop(t + 0.13);
  }catch(e){}
}

function blip(freq, vol){
  if(!soundOn || !started) return;
  try{
    const ac = ctx(), t = ac.currentTime;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    const o = ac.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(freq*1.3, t + 0.06);
    o.connect(g); g.connect(outBus());
    o.start(t); o.stop(t + 0.1);
  }catch(e){}
}

document.addEventListener('visibilitychange', ()=>{
  if(!started || !master) return;
  master.gain.setTargetAtTime(document.hidden ? 0 : (soundOn ? 1 : 0), ctx().currentTime, 0.5);
});

const ringGeo = new THREE.RingGeometry(0.82, 1, 96);
const rings = [];

function spawnRing(local, normal, delay){
  const T = TH();
  const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
    color:new THREE.Color(T.key), transparent:true, opacity:0, side:THREE.DoubleSide,
    blending: T.additive ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite:false
  }));
  m.position.copy(local).addScaledVector(normal, 0.03);
  m.lookAt(local.clone().add(normal));
  m.renderOrder = 5;
  m.scale.setScalar(0.001);
  m.userData.peak = T.ringOp;
  group.add(m);
  rings.push({ mesh:m, t:-delay, life:1.0 });
}

let wave = null;
const waveWorld = new THREE.Vector3();

function strikeAt(hit){
  const local = matte.worldToLocal(hit.point.clone());
  const normal = hit.face ? hit.face.normal.clone().normalize() : local.clone().normalize();

  wave = { t:0, life:1.15, local };
  uPC.value.copy(local);
  uPR.value = 0.02;
  uPI.value = 1;

  spawnRing(local, normal, 0);
  spawnRing(local, normal, 0.11);

  strike.position.copy(hit.point);
  strike.intensity = 14;
  strike.visible = true;

  duck();
  boop();
}

/* placeholder artwork — drawn procedurally, themed through CSS variables */
function seeded(seed){
  let a = seed >>> 0;
  return ()=>{
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function art(kind, seed){
  const r = seeded(seed * 2654435761 + 17);
  const W = 1000, H = 700;
  let s = '<rect width="'+W+'" height="'+H+'" fill="var(--ph0)"/>';
  for(let i=1;i<10;i++) s += '<line x1="'+(i*W/10)+'" y1="0" x2="'+(i*W/10)+'" y2="'+H+'" stroke="var(--ph1)" stroke-width="1"/>';
  for(let i=1;i<7;i++)  s += '<line x1="0" y1="'+(i*H/7)+'" x2="'+W+'" y2="'+(i*H/7)+'" stroke="var(--ph1)" stroke-width="1"/>';

  if(kind === 0){                                   // logos
    const cx = 340 + r()*320, cy = 300 + r()*110;
    s += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(150+r()*45)+'" fill="none" stroke="var(--ph2)" stroke-width="2"/>';
    s += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(92+r()*30)+'" fill="var(--ph3)"/>';
    s += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(44+r()*18)+'" fill="var(--ph0)"/>';
    s += '<path d="M'+(cx-230)+' '+cy+' h'+(460)+'" stroke="var(--ph2)" stroke-width="2"/>';
    s += '<rect x="'+(cx+120)+'" y="'+(cy-190)+'" width="86" height="86" fill="var(--ph2)"/>';
  }else if(kind === 1){                             // posters
    s += '<rect x="90" y="70" width="'+(W-180)+'" height="'+(H-140)+'" fill="none" stroke="var(--ph2)" stroke-width="2"/>';
    let y = 130;
    for(let i=0;i<6;i++){
      const w = 180 + r()*580;
      s += '<rect x="140" y="'+y+'" width="'+w+'" height="'+(i===0?46:18)+'" fill="'+(i===0?'var(--ph3)':'var(--ph2)')+'"/>';
      y += (i===0?90:44);
    }
    s += '<rect x="'+(W-320)+'" y="'+(H-250)+'" width="180" height="180" fill="var(--ph3)" opacity=".9"/>';
  }else if(kind === 2){                             // 3d
    const cx = 500, cy = 350, k = 150 + r()*40;
    const p = (x,y)=> (cx + x) + ',' + (cy + y);
    s += '<polygon points="'+p(0,-k*1.15)+' '+p(k,-k*0.55)+' '+p(0,0)+' '+p(-k,-k*0.55)+'" fill="var(--ph3)" opacity=".92"/>';
    s += '<polygon points="'+p(-k,-k*0.55)+' '+p(0,0)+' '+p(0,k*1.15)+' '+p(-k,k*0.55)+'" fill="var(--ph2)"/>';
    s += '<polygon points="'+p(k,-k*0.55)+' '+p(0,0)+' '+p(0,k*1.15)+' '+p(k,k*0.55)+'" fill="var(--ph1)"/>';
    s += '<polygon points="'+p(0,-k*1.15)+' '+p(k,-k*0.55)+' '+p(k,k*0.55)+' '+p(0,k*1.15)+' '+p(-k,k*0.55)+' '+p(-k,-k*0.55)+'" fill="none" stroke="var(--ph2)" stroke-width="2"/>';
  }else if(kind === 3){                             // xr
    for(let i=0;i<4;i++){
      const m = 110 + i*70;
      s += '<rect x="'+m+'" y="'+(m*0.62)+'" width="'+(W-m*2)+'" height="'+(H-m*1.24)+'" fill="none" stroke="var(--ph2)" stroke-width="'+(i===0?2:1)+'"/>';
    }
    s += '<circle cx="500" cy="350" r="8" fill="var(--ph3)"/>';
    s += '<path d="M420 350 h50 M530 350 h50 M500 270 v50 M500 380 v50" stroke="var(--ph3)" stroke-width="2"/>';
    for(let i=0;i<9;i++) s += '<circle cx="'+(160+r()*680)+'" cy="'+(120+r()*460)+'" r="'+(3+r()*5)+'" fill="var(--ph2)"/>';
  }else{                                            // motion
    for(let i=0;i<7;i++){
      s += '<rect x="'+(110 + i*104)+'" y="'+(200 + Math.sin(i*0.9)*70)+'" width="72" height="'+(180 + i*22)+'" fill="var(--ph2)" opacity="'+(0.25 + i*0.11).toFixed(2)+'"/>';
    }
    for(let i=0;i<4;i++) s += '<rect x="90" y="'+(110 + i*140)+'" width="'+(300 + r()*520)+'" height="2" fill="var(--ph3)" opacity=".5"/>';
    s += '<rect x="'+(W-260)+'" y="'+(H-190)+'" width="150" height="90" fill="var(--ph3)"/>';
  }

function mark(i){
  const r = seeded(i*7919 + 31);
  const p = [];
  const n = 2 + Math.floor(r()*3);
  for(let k=0;k<n;k++){
    const t = r();
    if(t < 0.34) p.push('<circle cx="'+(70+r()*160)+'" cy="'+100+'" r="'+(22+r()*30)+'" fill="none" stroke="var(--ph3)" stroke-width="7"/>');
    else if(t < 0.67) p.push('<rect x="'+(60+r()*150)+'" y="'+(58+r()*30)+'" width="'+(34+r()*54)+'" height="'+(34+r()*54)+'" fill="var(--ph3)"/>');
    else p.push('<path d="M'+(58+r()*60)+' 148 L'+(120+r()*50)+' 52 L'+(200+r()*40)+' 148 Z" fill="none" stroke="var(--ph3)" stroke-width="7"/>');
  }
  return '<svg viewBox="0 0 300 200"><rect width="300" height="200" fill="none"/>'+p.join('')+'</svg>';
}

/* ══ explore chips ════════════════════════════════════════════════════════ */
const exploreEl = document.getElementById('explore');
const chips = FIELDS.map((f,i)=>{
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'chip'; b.dataset.tag = f.key;
  b.innerHTML = '<i>'+String(i+1).padStart(2,'0')+'</i><span>'+f.key+'</span>';
  b.addEventListener('pointerenter', ()=>{ setActive(i); blip(1240, 0.03); });
  b.addEventListener('click', ()=>openField(i));
  exploreEl.appendChild(b);
  return b;
});
const chipAngle = FIELDS.map((f,i)=> -Math.PI/2 + i*(Math.PI*2/FIELDS.length));
let active = 0;
chips[0].classList.add('hot');

let chipRX = 1, chipRY = 1;
const stacked = ()=> innerWidth <= 720;

function placeChips(){
  if(stacked()){
    // the ring flattens into a strip parked above the bottom bar
    const bot = document.querySelector('.bot');
    const hud = document.querySelector('.hud');
    const pad = parseFloat(getComputedStyle(hud).paddingBottom) || 14;
    exploreEl.style.bottom = ((bot ? bot.offsetHeight : 60) + pad + 16) + 'px';
    chips.forEach(c=>{ c.style.left = ''; c.style.top = ''; c.classList.remove('hot'); });
    return;
  }
  exploreEl.style.bottom = '';
  chipRX = Math.min(VW*0.40, 400);
  chipRY = Math.min(VH*0.33, 265);
  chips.forEach((c,i)=>{
    c.style.left = (cxMid() + Math.cos(chipAngle[i])*chipRX) + 'px';
    c.style.top  = (cyMid() + Math.sin(chipAngle[i])*chipRY) + 'px';
    c.classList.toggle('hot', i === active);
  });
}

// anywhere inside the ring counts as still reaching for it, so the labels
// survive a slow drift from the form out to a label
function inReach(){
  const dx = (pointerX - cxMid()) / (chipRX * 1.34);
  const dy = (pointerY - cyMid()) / (chipRY * 1.34);
  return dx*dx + dy*dy <= 1;
}

function setActive(i){
  active = i;
  if(stacked()) return;
  chips.forEach((c,k)=>c.classList.toggle('hot', k === i));
}

let hoverForm = false, hoverChips = false, exploreTimer = null;
function refreshExplore(){
  clearTimeout(exploreTimer);
  if(panelOpen || !started){ exploreEl.classList.remove('on'); return; }
  if(stacked()){ exploreEl.classList.add('on'); return; }   // always there on a phone
  const open = exploreEl.classList.contains('on');
  if(hoverForm || hoverChips || (open && inReach())) exploreEl.classList.add('on');
  else exploreTimer = setTimeout(()=>{
    if(!panelOpen && !(hoverForm || hoverChips)) exploreEl.classList.remove('on');
  }, 420);
}
exploreEl.addEventListener('pointerenter', ()=>{ hoverChips = true; refreshExplore(); });
exploreEl.addEventListener('pointerleave', ()=>{ hoverChips = false; refreshExplore(); });

function openWork(k){

    ? '<img src="'+w.img+'" alt="'+w.t+'" decoding="async">'

function stepWork(d){

  openWork((workIx + d + n) % n);

function closePanel(){

/* ══ pointer, reticle, interface ══════════════════════════════════════════ */
const ret = document.getElementById('ret');
const retTag = document.getElementById('rettag');
const fpsOut = document.getElementById('fps');

const raycaster = new THREE.Raycaster();
const ndcPt = new THREE.Vector2();
const target = new THREE.Vector3();
const ndc = new THREE.Vector3();
let mx=0, my=0, px=0, py=0, touched=false, clock=0, intro=0, radius=0, rGoal=0;
let pointerX = innerWidth/2, pointerY = innerHeight/2, retX = pointerX, retY = pointerY;
let VX = 0, VY = 0, VW = innerWidth, VH = innerHeight, visH = 4.5, centreY = 0;
let letterW = 2.1, letterH = FIT;
const cxMid = ()=> VX + VW/2;
const cyMid = ()=> VY + VH/2;
let spin = 0, spinV = 0, groupX = 0;

// the only thing the reticle ever says is the invitation to start
function syncTag(){
  retTag.textContent = hoverForm ? (started ? 'MORPH' : 'INTERACT') : '';
}

function toWorld(cx, cy){
  ndc.set(((cx - VX)/VW)*2-1, -((cy - VY)/VH)*2+1, 0.5).unproject(camera);
  ndc.sub(camera.position).normalize();
  return camera.position.clone().addScaledVector(ndc, -camera.position.z/ndc.z);
}

function pick(cx, cy){
  if(!ready) return null;
  ndcPt.set(((cx - VX)/VW)*2-1, -((cy - VY)/VH)*2+1);
  raycaster.setFromCamera(ndcPt, camera);
  const hits = raycaster.intersectObject(matte, false);
  return hits.length ? hits[0] : null;
}

addEventListener('pointermove', e=>{
  pointerX = e.clientX; pointerY = e.clientY;
  target.copy(toWorld(e.clientX, e.clientY));
  mx = (e.clientX - cxMid())/(VW/2);
  my = (e.clientY - cyMid())/(VH/2);
  rGoal = 1;
  if(!touched) touched = true;
  if(coarse) return;

  ret.classList.add('on');

  const ui = e.target.closest ? e.target.closest('[data-tag]') : null;
  const inPanel = e.target.closest ? e.target.closest('.panel') : null;
  const over = !ui && !inPanel && !!pick(e.clientX, e.clientY);

  if(over !== hoverForm){
    hoverForm = over;
    if(over) blip(1500, 0.035);
  }
  refreshExplore();

  // the direction you lean picks the field
  if(exploreEl.classList.contains('on') && !ui && !stacked()){
    const a = Math.atan2(e.clientY - cyMid(), (e.clientX - cxMid()) * (VH/VW));
    let best = 0, bd = 9;
    chipAngle.forEach((ca,i)=>{
      let d = Math.abs(((a - ca + Math.PI*3) % (Math.PI*2)) - Math.PI);
      if(d < bd){ bd = d; best = i; }
    });
    setActive(best);
  }

  ret.classList.toggle('lock', !!ui || over);
  syncTag();
}, { passive:true });

addEventListener('pointerleave', ()=>{
  rGoal = 0; mx = 0; my = 0;
  ret.classList.remove('on');
  hoverForm = false; refreshExplore();
});

addEventListener('pointerdown', e=>{
  if(e.target.closest && e.target.closest('[data-tag]')) return;   // interface handles itself
  startAudio();
  const hit = pick(e.clientX, e.clientY);
  if(hit){
    const local = matte ? matte.worldToLocal(hit.point.clone()) : null;
    strikeAt(hit);
    startMorph(local);
    hoverForm = true;
  }
  refreshExplore();
}, { passive:true });

// interface feedback
document.querySelectorAll('.hud a, .hud button').forEach(a=>{
  a.addEventListener('pointerenter', ()=>blip(1180, 0.03));
  if(a.id === 'sound') return;
  a.addEventListener('pointerdown', ()=>{ startAudio(); blip(880, 0.06); });
});

// the wheel turns the form about its own vertical axis, so you can walk around it
addEventListener('wheel', e=>{
  if(e.target.closest && e.target.closest('.panel')) return;
  spinV += e.deltaY * 0.00030;
  spinV = THREE.MathUtils.clamp(spinV, -0.075, 0.075);
}, { passive:true });

const soundBtn = document.getElementById('sound');
const soundLabel = document.getElementById('soundlabel');

function paintSound(){

  soundBtn.classList.toggle('live', live);

soundBtn.addEventListener('click', e=>{

const themeBtn = document.getElementById('theme');

function applyTheme(){

  themeIcon.textContent = mode === 'light' ? '◑' : '◐';

  rimLight.intensity = T.rimI;
  ambLight.intensity = T.ambI;
  ambLight.color = new THREE.Color(T.ambC);

  if(field){
    field.material.opacity = T.fieldOp;
    const c = new THREE.Color(T.field);
    for(let i=0;i<blocks.length;i++) field.setColorAt(i, c);

/* ══ layout ═══════════════════════════════════════════════════════════════ */
// everything measures the canvas itself. innerHeight lies on phones — the
// layout viewport runs behind the browser chrome — so the drawing buffer, the
// projection and the pointer maths are all pinned to the element's real box.
function chromeBands(){
  const hud = document.querySelector('.hud');
  const top = document.querySelector('.top');
  const bot = document.querySelector('.bot');
  const cs = hud ? getComputedStyle(hud) : null;
  const padT = cs ? (parseFloat(cs.paddingTop) || 0) : 24;
  const padB = cs ? (parseFloat(cs.paddingBottom) || 0) : 24;
  return {
    t: (top ? top.offsetHeight : 40) + padT,
    b: (bot ? bot.offsetHeight : 46) + padB + (stacked() ? 56 : 0)
  };
}

// the form is framed inside the space the interface leaves, not the whole screen
function fitView(){
  const r = canvas.getBoundingClientRect();
  VX = r.left; VY = r.top;
  VW = Math.max(1, Math.round(r.width));
  VH = Math.max(1, Math.round(r.height));

  const band = chromeBands();
  const freeH = Math.max(140, VH - band.t - band.b);
  const hFrac = stacked() ? 0.60 : 0.72;      // of the free band
  const wFrac = stacked() ? 0.74 : 0.60;      // of the full width
  const aspect = VW / VH;

  visH = Math.max(letterH * VH / (freeH * hFrac), letterW / (wFrac * aspect), 3.4);
  camera.position.z = visH / (2*Math.tan(FOV*Math.PI/360));
  camera.aspect = aspect;
  camera.updateProjectionMatrix();

  // put the form in the middle of the free band rather than the middle of the glass
  const centrePx = band.t + freeH/2;
  centreY = (VH/2 - centrePx) * (visH / VH);
}

function fitPoster(){
  const dist = camera.position.z - BACK_Z;
  const h = 2*Math.tan(FOV*Math.PI/360)*dist;
  poster.scale.set(h*camera.aspect, h, 1);
}

function resize(){
  fitView();
  renderer.setSize(VW, VH, false);
  sizeDust();
  fitPoster();
  drawPoster(VW, VH, Math.min(devicePixelRatio, 2));
  placeChips();
  refreshExplore();
}
addEventListener('resize', resize);
addEventListener('orientationchange', ()=>setTimeout(resize, 120));
if(window.visualViewport) visualViewport.addEventListener('resize', resize);
resize();
applyTheme();
// the bars change height once the webfont lands, so measure again
if(document.fonts && document.fonts.ready) document.fonts.ready.then(resize).catch(()=>{});
setTimeout(resize, 400);

/* ══ frame ════════════════════════════════════════════════════════════════ */
let first = true, last = performance.now(), fpsAcc = 0, fpsN = 0, bootP = 0;

function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last)/1000 || 0.016);
  last = now;
  clock += 0.0068;

  if(bootP < 100){
    bootP += ((ready ? 100 : 88) - bootP) * (ready ? 0.16 : 0.05);
    bootfill.style.width = Math.min(100, bootP) + '%';
    bootpct.textContent = String(Math.round(Math.min(100, bootP))).padStart(2,'0');
    if(ready && bootP > 99.2 && first){
      first = false;
      bootmsg.textContent = 'READY';
      boot.classList.add('gone');
      setTimeout(()=>boot.remove(), 900);
    }
  }

  if(ready){
    intro = Math.min(1, intro + 0.009);
    const ease = 1 - Math.pow(1 - intro, 3);

    if(!touched || reduce){
      target.set(Math.sin(clock*1.1)*0.9, Math.cos(clock*0.72)*1.0, 0);
      rGoal = reduce ? 1 : 0.9;
    }

    radius += (rGoal - radius) * 0.055;
    uC.value.lerp(target, touched ? 0.16 : 0.05);
    uR1.value = 0.62 * radius * ease;
    uR2.value = 1.02 * radius * ease;

    // wheel-driven turn about the local up axis, with weight
    spin += spinV;
    spinV *= reduce ? 0.7 : 0.945;
    if(Math.abs(spinV) < 0.00002) spinV = 0;

    // the form steps aside when the archive is open
    const gx = (panelOpen && VW > 900) ? -1.55 : 0;
    groupX += (gx - groupX) * 0.055;

    px += (mx - px)*0.04; py += (my - py)*0.04;
    group.rotation.y = spin + px*0.42 + Math.sin(clock*0.75)*0.13 + (1-ease)*0.8;
    group.rotation.x = -py*0.26 + Math.sin(clock*0.53)*0.08;
    group.rotation.z = Math.sin(clock*0.41)*0.045;
    group.position.x = groupX;
    group.position.y = centreY + Math.sin(clock*1.15)*0.1;
    // the letter lands with a little weight behind it
    if(popT >= 0){
      popT += dt;
      const pk = popT / 0.62;
      if(pk >= 1){ popT = -1; pop = 0; }
      else pop = Math.sin(pk*Math.PI*2.2) * 0.05 * Math.pow(1 - pk, 2.0);
    }
    group.scale.setScalar((0.9 + 0.1*ease) * (panelOpen && VW > 900 ? 0.86 : 1) * (1 + pop));

    stepMorph(dt);
    applyFades(ease);

    let waveI = 0;
    if(wave){
      wave.t += dt;
      const k = wave.t / wave.life;
      if(k >= 1){
        wave = null; uPI.value = 0; uPR.value = 0;
      }else{
        const e2 = 1 - Math.pow(1 - k, 2.4);
        uPR.value = 0.02 + e2 * 3.6;
        uPI.value = Math.pow(1 - k, 1.7);
        waveI = uPI.value;
        waveWorld.copy(wave.local); group.localToWorld(waveWorld);
      }
    }
    for(let i=rings.length-1; i>=0; i--){
      const r = rings[i];
      r.t += dt;
      if(r.t < 0) continue;
      const k = r.t / r.life;
      if(k >= 1){ group.remove(r.mesh); r.mesh.material.dispose(); rings.splice(i,1); continue; }
      const e2 = 1 - Math.pow(1 - k, 2.6);
      r.mesh.scale.setScalar(0.05 + e2 * 2.4);
      r.mesh.material.opacity = Math.pow(1 - k, 1.8) * (r.mesh.userData.peak || 0.55);
    }
    if(strike.visible){
      strike.intensity *= Math.pow(0.02, dt);
      if(strike.intensity < 0.05){ strike.intensity = 0; strike.visible = false; }
    }

    updateField(ease, clock*8, waveWorld, uPR.value, waveI);
  }

  if(!coarse){
    retX += (pointerX - retX) * 0.42;
    retY += (pointerY - retY) * 0.42;
    ret.style.transform = 'translate(' + retX.toFixed(1) + 'px,' + retY.toFixed(1) + 'px) translate(-50%,-50%)';
  }

  renderer.render(scene, camera);

  fpsAcc += dt; fpsN++;
  if(fpsAcc >= 0.5){
    fpsOut.textContent = String(Math.round(fpsN / fpsAcc)).padStart(2,'0');
    fpsAcc = 0; fpsN = 0;
  }
}
requestAnimationFrame(frame);
</script>
</body>
